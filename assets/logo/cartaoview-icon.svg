<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CartãoView icon">
  <defs>
    <linearGradient id="cvBrand" x1="16" y1="16" x2="144" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="cvBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- App badge -->
  <rect x="8" y="8" width="144" height="144" rx="38" fill="url(#cvBrand)"/>

  <!-- Credit card -->
  <rect x="34" y="44" width="92" height="60" rx="12" fill="#ffffff" opacity="0.96"/>
  <!-- Magnetic stripe / chip row -->
  <rect x="34" y="58" width="92" height="9" fill="#6366F1" opacity="0.35"/>
  <rect x="44" y="88" width="20" height="6" rx="3" fill="#94A3B8"/>

  <!-- Ascending bars = the "View"/dashboard -->
  <g>
    <rect x="82" y="82" width="9" height="12" rx="2.5" fill="url(#cvBar)"/>
    <rect x="96" y="76" width="9" height="18" rx="2.5" fill="url(#cvBar)"/>
    <rect x="110" y="70" width="9" height="24" rx="2.5" fill="url(#cvBar)"/>
  </g>

  <!-- View spark / rising accent -->
  <path d="M80 104 L98 92 L112 98 L134 78" stroke="#22D3EE" stroke-width="0" fill="none"/>
</svg>
